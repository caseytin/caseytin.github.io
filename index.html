<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>under construction</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #111;
      color: #eee;
      font-family: 'Geist Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .illustration {
      width: 180px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.1s forwards;
    }

    /* gentle wok toss */
    .pan-group {
      animation: wokJiggle 1.4s ease-in-out infinite;
      transform-origin: 50px 92px;
    }
    @keyframes wokJiggle {
      0%   { transform: translateX(0px)  rotate(0deg); }
      25%  { transform: translateX(2.5px)  rotate(0.8deg); }
      50%  { transform: translateX(0px)  rotate(0deg); }
      75%  { transform: translateX(-2.5px) rotate(-0.8deg); }
      100% { transform: translateX(0px)  rotate(0deg); }
    }

    /* steam puffs */
    .steam {
      animation: steamRise var(--dur, 2s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes steamRise {
      0%   { opacity: 0;   transform: translateY(0)     scaleX(1); }
      20%  { opacity: 0.5; }
      80%  { opacity: 0.1; }
      100% { opacity: 0;   transform: translateY(-22px) scaleX(1.5); }
    }

    .text {
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.4s forwards;
    }

    .text h1 {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #eee;
      margin-bottom: 0.5rem;
    }

    .text p {
      font-size: 0.7rem;
      font-weight: 300;
      color: #555;
      letter-spacing: 0.04em;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .svg-wrap {
      position: relative;
      width: 180px;
    }

    #sizzleCanvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="svg-wrap">
    <svg class="illustration" viewBox="0 0 160 130" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Stove burner -->
      <ellipse cx="88" cy="100" rx="38" ry="8" fill="#1a1a1a"/>
      <ellipse cx="88" cy="100" rx="28" ry="5" fill="#222"/>
      <ellipse cx="88" cy="100" rx="16" ry="3" fill="#2a2a2a"/>
      <ellipse cx="88" cy="100" rx="28" ry="5" stroke="#c04a00" stroke-width="1" fill="none" opacity="0.5"/>
      <ellipse cx="88" cy="100" rx="16" ry="3" stroke="#e05500" stroke-width="1" fill="none" opacity="0.7"/>
      <ellipse cx="74"  cy="99" rx="2.5" ry="1.5" fill="#f70" opacity="0.85"/>
      <ellipse cx="88"  cy="97" rx="2.5" ry="1.5" fill="#f90" opacity="0.85"/>
      <ellipse cx="102" cy="99" rx="2.5" ry="1.5" fill="#f70" opacity="0.85"/>
      <ellipse cx="81"  cy="98" rx="1.8" ry="1.2" fill="#fc0" opacity="0.7"/>
      <ellipse cx="95"  cy="98" rx="1.8" ry="1.2" fill="#fc0" opacity="0.7"/>

      <!-- Pan + handle group -->
      <g class="pan-group">
        <rect x="16" y="83" width="50" height="10" rx="5" fill="#555"/>
        <rect x="16" y="85" width="50" height="6"  rx="3" fill="#666"/>
        <ellipse cx="90" cy="88" rx="37" ry="10" fill="#444"/>
        <ellipse cx="90" cy="86" rx="37" ry="8"  fill="#4e4e4e"/>
        <ellipse cx="90" cy="87" rx="31" ry="6.5" fill="#2e2e2e"/>

        <!-- food -->
        <ellipse cx="82" cy="87" rx="9"  ry="4"   fill="#c8742a" opacity="0.9"/>
        <ellipse cx="96" cy="86" rx="7"  ry="3.5" fill="#b8621a" opacity="0.9"/>
        <ellipse cx="88" cy="90" rx="5"  ry="2.5" fill="#d4823a" opacity="0.8"/>
        <ellipse cx="76" cy="90" rx="4"  ry="2"   fill="#bf6a20" opacity="0.7"/>
        <ellipse cx="100" cy="89" rx="4" ry="2"   fill="#c47030" opacity="0.75"/>
      </g>

      <!-- Steam puffs -->
      <ellipse class="steam" cx="78"  cy="72" rx="5" ry="7" fill="#999" opacity="0.15" style="--dur:3s;   --delay:0s;"/>
      <ellipse class="steam" cx="90"  cy="65" rx="6" ry="8" fill="#999" opacity="0.15" style="--dur:3.6s; --delay:0.9s;"/>
      <ellipse class="steam" cx="101" cy="70" rx="5" ry="7" fill="#999" opacity="0.15" style="--dur:3.2s; --delay:1.6s;"/>

      <!-- Ground line -->
      <line x1="18" y1="112" x2="142" y2="112" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>

    </svg>

    <canvas id="sizzleCanvas"></canvas>
  </div>

  <div class="text">
    <h1>under construction</h1>
    <p>let us cook 🍳</p>
  </div>

  <script>
    const canvas = document.getElementById('sizzleCanvas');
    const wrap   = canvas.closest('.svg-wrap');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = wrap.offsetWidth;
      canvas.height = wrap.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const lines = [
      { xFrac: 0.40, yFrac: 0.68, phase: 0,   speed: 1.2, amp: 3,   wavelength: 18, alpha: 0.5,  width: 1.4 },
      { xFrac: 0.52, yFrac: 0.63, phase: 1.2, speed: 1.0, amp: 3.5, wavelength: 20, alpha: 0.4,  width: 1.2 },
      { xFrac: 0.63, yFrac: 0.67, phase: 2.5, speed: 1.3, amp: 2.8, wavelength: 16, alpha: 0.45, width: 1.3 },
      { xFrac: 0.46, yFrac: 0.60, phase: 0.8, speed: 0.9, amp: 3,   wavelength: 22, alpha: 0.3,  width: 1.1 },
      { xFrac: 0.58, yFrac: 0.58, phase: 3.1, speed: 1.1, amp: 3.2, wavelength: 18, alpha: 0.28, width: 1.0 },
    ];

    let t = 0;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      t += 0.018; // slower tick

      lines.forEach(line => {
        const cx  = canvas.width  * line.xFrac;
        const cy  = canvas.height * line.yFrac;
        const len = 22;

        ctx.beginPath();
        ctx.strokeStyle = `rgba(200, 200, 200, ${line.alpha})`;
        ctx.lineWidth   = line.width;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';

        for (let i = 0; i <= len; i++) {
          const y        = cy - i;
          const progress = i / len;
          const fade     = Math.sin(progress * Math.PI);
          const x        = cx + Math.sin((i / line.wavelength) * Math.PI * 2 + t * line.speed + line.phase) * line.amp * fade;

          if (i === 0) ctx.moveTo(x, y);
          else         ctx.lineTo(x, y);
        }
        ctx.stroke();
      });

      requestAnimationFrame(draw);
    }

    draw();
  </script>

</body>
</html>
